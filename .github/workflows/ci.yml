name: bancs d'essai

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # base, conflits entre postes, péremption, exports, météo, sauvegardes, mises à jour, reprise,
  # serveur : sur les trois systèmes des postes du cabinet
  essais:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Base et serveur (Rust)
        run: cargo test -p tooth

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'

      # l'interface : chaque module JavaScript doit au moins se lire
      - name: Interface (syntaxe)
        if: runner.os == 'Linux'
        run: for f in $(find web -name '*.js' -not -path '*/node_modules/*' -not -path '*/vendor/*' -not -path '*/tests/*'); do node --check "$f" || exit 1; done

  # un poste resté sur l'ancien serveur Python, lancé sans le launcher et sans cargo, se met à
  # jour tout seul et arrive sur le serveur Rust (téléchargé), sur la même base
  passage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ancien serveur.py -> mise à jour -> serveur Rust
        run: python scripts/essai_passage.py
