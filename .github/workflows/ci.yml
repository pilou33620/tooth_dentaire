name: bancs d'essai

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # base, conflits entre postes, péremption, exports, météo, sauvegardes, mises à jour, reprise,
  # serveur : sur les trois systèmes des postes du cabinet
  essais:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Base et serveur (Rust)
        run: cargo test -p tooth

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'

      # l'interface : chaque module JavaScript doit au moins se lire
      - name: Interface (syntaxe)
        if: runner.os == 'Linux'
        run: for f in $(find web -name '*.js' -not -path '*/node_modules/*' -not -path '*/vendor/*' -not -path '*/tests/*'); do node --check "$f" || exit 1; done

  # l'ancien serveur Python et le serveur Rust, côte à côte sur des copies de la même base :
  # mêmes réponses, mêmes exports Excel, même base à la fin, retour arrière possible
  differentiel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances de l'ancien serveur
        run: python -m pip install --quiet -r requirements.txt

      - name: Serveur Rust
        run: cargo build --release -p tooth

      - name: Python et Rust côte à côte
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/differentiel.py target/release/tooth$([ "$RUNNER_OS" = Windows ] && echo .exe)
