name: bancs d'essai

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # base, conflits entre postes, péremption, exports, météo, sauvegardes, mises à jour, reprise,
  # serveur : sur les trois systèmes des postes du cabinet
  essais:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Base et serveur (Rust)
        # --locked : un Cargo.lock incomplet ferait échouer l'essai (sur un poste qui a cargo, il
        # modifierait un fichier suivi et bloquerait la mise à jour suivante)
        run: cargo test --locked -p tooth

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'

      # l'interface : chaque module JavaScript doit au moins se lire
      - name: Interface (syntaxe)
        if: runner.os == 'Linux'
        run: for f in $(find web -name '*.js' -not -path '*/node_modules/*' -not -path '*/vendor/*' -not -path '*/tests/*'); do node --check "$f" || exit 1; done

  # La copie de production (archive décompressée dans un dossier vide, sans git ni sources) démarre
  # par demarrer_TOOTH_DENTAIRE et répond, sur les trois systèmes. Sa mise à jour sans git est
  # testée dans la caisse commune (web_tools_commun, module production).
  production:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, nom: linux-x86_64 }
          - { os: windows-latest, nom: windows-x86_64 }
          - { os: macos-latest, nom: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Exécutable et archives de ce commit
        shell: bash
        run: |
          cargo build --release --locked -p tooth --bins
          sh scripts/archives.sh target/release ${{ matrix.nom }}

      - name: Copie de production (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir essai && tar -xzf tooth-prod-${{ matrix.nom }}.tar.gz -C essai
          cd essai/tooth_dentaire
          test ! -e .git && test ! -e Cargo.toml && test ! -e rust && ! ls *.py 2>/dev/null
          sh demarrer_TOOTH_DENTAIRE.sh --sans-maj --local --sans-navigateur --sans-pause --port 18150 > journal.txt 2>&1 < /dev/null &
          code=000
          for i in $(seq 30); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:18150/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          pkill -f "bin/tooth" || true
          echo "réponse : $code"
          [ "$code" = 200 ] || { tail -40 journal.txt; exit 1; }

      - name: Copie de production (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive tooth-prod-windows-x86_64.zip -DestinationPath essai
          Set-Location essai\tooth_dentaire
          if ((Test-Path .git) -or (Test-Path Cargo.toml) -or (Test-Path rust) -or (Get-ChildItem *.py)) { throw "l'archive contient des sources" }
          Start-Process cmd -ArgumentList '/c', 'demarrer_TOOTH_DENTAIRE.cmd', '--sans-maj', '--local', '--sans-navigateur', '--sans-pause', '--port', '18150' -RedirectStandardOutput journal.txt -NoNewWindow
          $code = 0
          for ($i = 0; $i -lt 30; $i++) {
            try { $code = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:18150/).StatusCode } catch { }
            if ($code -eq 200) { break }
            Start-Sleep 1
          }
          Stop-Process -Name tooth -Force -ErrorAction SilentlyContinue
          "réponse : $code"
          if ($code -ne 200) { Get-Content journal.txt -Tail 40; exit 1 }
