name: exécutables

# Compile l'exécutable de l'outil pour chaque système et le dépose dans la publication « binaires »,
# en deux archives par système (.tar.gz, .zip sous Windows), chacune avec son empreinte SHA-256
# (scripts/archives.sh) :
# - tooth-<système> : l'exécutable seul, que scripts/binaires.sh et .cmd prennent sur un clone git
#   sans cargo (Raspberry Pi, PC sans Rust) ;
# - tooth-prod-<système> : la production, complète et sans git (exécutable, pages, scripts de
#   démarrage, README), à décompresser puis lancer par demarrer_TOOTH_DENTAIRE ; elle se met
#   ensuite à jour seule depuis cette même archive.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl : exécutables statiques, indépendants de la glibc du poste (Raspberry Pi OS)
          - { os: ubuntu-latest, cible: x86_64-unknown-linux-musl, nom: linux-x86_64 }
          - { os: ubuntu-24.04-arm, cible: aarch64-unknown-linux-musl, nom: linux-aarch64 }
          - { os: macos-latest, cible: aarch64-apple-darwin, nom: macos-aarch64 }
          - { os: windows-latest, cible: x86_64-pc-windows-msvc, nom: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.cible }}

      - if: contains(matrix.cible, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release -p tooth --bins --target ${{ matrix.cible }}

      - name: Archives (l'exécutable seul ; la production)
        shell: bash
        run: sh scripts/archives.sh target/${{ matrix.cible }}/release ${{ matrix.nom }}

      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # les quatre compilations arrivent ensemble : une seule crée la publication
          gh release view binaires >/dev/null 2>&1 \
            || gh release create binaires --title "Exécutables" \
                 --notes "Exécutables de tooth_dentaire, recompilés à chaque envoi sur main. tooth-<système> : pris par scripts/binaires.sh et binaires.cmd. tooth-prod-<système> : la production complète, à décompresser puis lancer par demarrer_TOOTH_DENTAIRE." \
            || true
          # chaque archive a son empreinte (.sha256), faite par scripts/archives.sh
          gh release upload binaires tooth-${{ matrix.nom }}.* tooth-prod-${{ matrix.nom }}.* --clobber
