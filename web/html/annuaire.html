<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';">
    <title>Carnets d'Adresses Animé</title>
    <style>
        :root {
            --paper-color: #fdfbf7;
            --line-color: #dcdcdc;
            --margin-color: #ff9999;
            --cover-color: #2c3e50;
            --text-color: #333;
            --primary-color: #3498db;
            --danger-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .notebook-container {
            perspective: 1500px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .notebook {
            width: 95%;
            max-width: 900px;
            height: 90%;
            max-height: 600px;
            display: flex;
            background: var(--paper-color);
            border-radius: 5px 15px 15px 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05),
                        10px 10px 30px rgba(0,0,0,0.2);
            position: relative;
            transform-style: preserve-3d;
        }

        .binding {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 40px;
            margin-left: -20px;
            background: linear-gradient(to right, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.1) 100%);
            z-index: 10;
        }
        
        .binding::after {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 50%;
            width: 20px;
            margin-left: -10px;
            background-image: radial-gradient(circle, #555 4px, transparent 5px);
            background-size: 100% 30px;
        }

        .page {
            flex: 1;
            height: 100%;
            padding: 40px 40px 40px 60px;
            position: relative;
            background-image: 
                linear-gradient(transparent 95%, var(--line-color) 100%);
            background-size: 100% 30px;
            line-height: 30px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .page::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 40px;
            width: 2px;
            background-color: var(--margin-color);
        }

        .page.left {
            border-radius: 5px 0 0 5px;
            padding: 40px 60px 40px 40px;
        }
        
        .page.left::before {
            left: auto;
            right: 40px;
        }

        .page.right {
            border-radius: 0 15px 15px 0;
        }

        .page-flip {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: var(--paper-color);
            border-radius: 0 15px 15px 0;
            transform-origin: left center;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
            z-index: 20;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            background-image: linear-gradient(transparent 95%, var(--line-color) 100%);
            background-size: 100% 30px;
        }

        .page-flip.flipped {
            transform: rotateY(-180deg);
        }

        h1, h2 {
            font-family: 'Georgia', serif;
            color: var(--text-color);
            margin-bottom: 20px;
            font-style: italic;
            border-bottom: 2px solid var(--text-color);
            display: inline-block;
            line-height: normal;
        }

        .contact-list {
            list-style: none;
            margin-top: 10px;
        }

        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 0 10px;
            margin-bottom: 0;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .contact-item:hover {
            background-color: rgba(52, 152, 219, 0.1);
            transform: translateX(5px);
        }

        .contact-item span {
            font-weight: 600;
        }

        .btn-add {
            display: block;
            margin: 20px auto 0;
            padding: 8px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            line-height: normal;
        }

        .btn-add:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 12px;
            line-height: normal;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }
        
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 5px 0;
            border: none;
            border-bottom: 1px dashed #999;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: var(--text-color);
            font-family: inherit;
            resize: none;
        }
        
        .form-group input:focus, .form-group textarea:focus {
            border-bottom: 1px solid var(--primary-color);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            line-height: normal;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-save { background-color: #2ecc71; color: white; }
        .btn-save:hover { background-color: #27ae60; }
        
        .btn-delete { background-color: var(--danger-color); color: white; }
        .btn-delete:hover { background-color: #c0392b; }
        
        .btn-cancel { background-color: #95a5a6; color: white; }
        .btn-cancel:hover { background-color: #7f8c8d; }

        .fade-content {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .empty-state {
            color: #999;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
            line-height: normal;
        }

        .page.right {
            font-size: 14px;
        }
        .page.right h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="notebook-container">
        <div class="notebook">
            <div class="binding"></div>
            
            <div class="page left">
                <h1>Carnets d'Adresses</h1>
                <div class="search-container" style="margin-bottom: 15px;">
                    <input type="text" id="search-input" placeholder="Rechercher un contact..." style="width: 100%; padding: 8px; border: none; border-bottom: 1px dashed #999; background: transparent; font-size: 14px; outline: none; color: var(--text-color); font-family: inherit;">
                </div>
                <ul class="contact-list" id="contact-list"></ul>
                <button class="btn-add" id="btn-nouveau-contact" type="button">+ Nouveau Contact</button>
            </div>

            <div class="page right" id="right-page-content">
                <div class="empty-state fade-content">
                    Sélectionnez un contact ou ajoutez-en un nouveau.
                </div>
            </div>
            
            <div class="page-flip" id="page-flip" style="display: none;"></div>
        </div>
    </div>

    <template id="form-template">
        <div class="fade-content">
            <h2 id="form-title">Nouveau Contact</h2>
            <input type="hidden" id="contact-id">
            
            <div class="form-row">
                <div class="form-group">
                    <label>Prénom</label>
                    <input type="text" id="contact-prenom" placeholder="Ex: Jean">
                </div>
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" id="contact-nom" placeholder="Ex: Dupont">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Entreprise / Rôle</label>
                    <input type="text" id="contact-entreprise" placeholder="Ex: Labo Prothèse">
                </div>
                <div class="form-group">
                    <label>Adresse Mail</label>
                    <input type="email" id="contact-email" placeholder="jean@exemple.com">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Téléphone Fixe</label>
                    <input type="tel" id="contact-tel-fixe" placeholder="Ex: 01 23 45 67 89">
                </div>
                <div class="form-group">
                    <label>Téléphone Portable</label>
                    <input type="tel" id="contact-tel-portable" placeholder="Ex: 06 12 34 56 78">
                </div>
            </div>

            <div class="form-group">
                <label>Adresse (N° et Voie)</label>
                <input type="text" id="contact-adresse" placeholder="Ex: 15 rue des Molières">
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 0.35;">
                    <label>Code Postal</label>
                    <input type="text" id="contact-cp" placeholder="Ex: 75001">
                </div>
                <div class="form-group" style="flex: 0.65;">
                    <label>Ville</label>
                    <input type="text" id="contact-ville" placeholder="Ex: Paris">
                </div>
            </div>
            
            <div class="form-group">
                <label>Note additionnelle</label>
                <textarea id="contact-note" rows="1" placeholder="Informations utiles..."></textarea>
            </div>
            
            <div class="form-actions">
                <button class="btn btn-save" type="button" data-action="enregistrer">Enregistrer</button>
                <button class="btn btn-delete" id="btn-delete" type="button" style="display:none;" data-action="supprimer">Supprimer</button>
                <button class="btn btn-cancel" type="button" data-action="annuler">Annuler</button>
            </div>
        </div>
    </template>

    <script src="annuaire.js"></script>
</body>
</html>
